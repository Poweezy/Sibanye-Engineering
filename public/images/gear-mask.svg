<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" focusable="false" aria-hidden="true">
  <!-- SES gear silhouette mask — exact geometry of GearWatermark.astro
       (12 teeth + ring r118-198 + hub r56). Opaque white = photo shows
       through; transparent = photo hidden. Used as the CSS mask-image for
       .ses-hero__gear-photo in HomeHero.astro. -->
  <g fill="#ffffff">
    <rect x="228" y="4" width="44" height="70" rx="8" transform="rotate(0 250 250)"/>
    <rect x="228" y="4" width="44" height="70" rx="8" transform="rotate(30 250 250)"/>
    <rect x="228" y="4" width="44" height="70" rx="8" transform="rotate(60 250 250)"/>
    <rect x="228" y="4" width="44" height="70" rx="8" transform="rotate(90 250 250)"/>
    <rect x="228" y="4" width="44" height="70" rx="8" transform="rotate(120 250 250)"/>
    <rect x="228" y="4" width="44" height="70" rx="8" transform="rotate(150 250 250)"/>
    <rect x="228" y="4" width="44" height="70" rx="8" transform="rotate(180 250 250)"/>
    <rect x="228" y="4" width="44" height="70" rx="8" transform="rotate(210 250 250)"/>
    <rect x="228" y="4" width="44" height="70" rx="8" transform="rotate(240 250 250)"/>
    <rect x="228" y="4" width="44" height="70" rx="8" transform="rotate(270 250 250)"/>
    <rect x="228" y="4" width="44" height="70" rx="8" transform="rotate(300 250 250)"/>
    <rect x="228" y="4" width="44" height="70" rx="8" transform="rotate(330 250 250)"/>
    <circle cx="250" cy="250" r="158" fill="none" stroke="#ffffff" stroke-width="80"/>
    <circle cx="250" cy="250" r="56"/>
  </g>
</svg>
